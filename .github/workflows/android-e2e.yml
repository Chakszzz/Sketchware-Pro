name: Android E2E Tests (Emulator + Maestro)

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level for emulator'
        required: false
        default: '31'
  pull_request:
    paths:
      - 'app/**'
      - 'maestro/**'
      - 'scripts/android-*.sh'
      - '.github/workflows/android-e2e.yml'

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Build, Unit Tests & Android E2E (API ${{ inputs.api_level || '31' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run JVM unit tests & build Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ inputs.api_level || '31' }}-x86_64-google_apis-pixel6

      - name: Run Maestro E2E Suite on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '31' }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8192M
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            chmod +x scripts/android-*.sh
            ./scripts/android-status.sh
            ./scripts/android-install.sh app/build/outputs/apk/debug/app-debug.apk
            ./scripts/android-test.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload E2E Artifacts (Screenshots, Logs, Reports, APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-artifacts-api-${{ inputs.api_level || '31' }}
          path: artifacts/android-e2e/
          if-no-files-found: warn
          retention-days: 14
